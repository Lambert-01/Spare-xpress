# ═══════════════════════════════════════════════════════
# SPARE XPRESS LTD - Nginx SEO & Performance Config
# Add this to your server block in Nginx
# ═══════════════════════════════════════════════════════

# ─── Gzip Compression ─────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    font/ttf
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy
    text/xml;

# ─── Browser Caching ───────────────────────────────────
# Static assets - 1 year
location ~* \.(css|js|woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}

# HTML - no cache
location ~* \.php$ {
    # Dynamic content - no caching
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# JSON API responses - short cache
location ~* \.(json|xml)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# ─── Security Headers ──────────────────────────────────
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ─── SEO Headers ───────────────────────────────────────
add_header Link "</sitemap.xml>; rel=\"sitemap\"" always;

# ─── Block Sensitive Files ─────────────────────────────
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(env|git|htaccess|htpasswd|ini|log|sql|bak|config|dist|fla|inc|psd|swp)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# ─── Block vendor directory ────────────────────────────
location /vendor/ {
    deny all;
    access_log off;
    log_not_found off;
}

# ─── Block admin from public (allow only by IP if needed) ──
# Uncomment to restrict admin access:
# location /admin/ {
#     allow 127.0.0.1;
#     allow YOUR_IP_HERE;
#     deny all;
# }

# ─── Custom Error Pages ────────────────────────────────
error_page 404 /pages/404.php;
location = /pages/404.php {
    internal;
}

error_page 500 502 503 504 /50x.html;
location = /50x.html {
    root /var/www/spare-xpress;
}

# ─── Prevent Hotlinking ────────────────────────────────
location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
    valid_referers none blocked sparexpressltd.com sparexpress.rw localhost;
    if ($invalid_referer) {
        return 403;
    }
    try_files $uri =404;
}

# ─── Favicon & Robots.txt (don't log 404s) ────────────
location = /favicon.ico {
    log_not_found off;
    access_log off;
}
location = /robots.txt {
    log_not_found off;
    access_log off;
    add_header Content-Type text/plain;
}
